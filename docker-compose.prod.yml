services:
  migrate:
    image: git.amabel.world/stanchito/sons-of-mountains:migrator
    env_file: .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  app:
    image: git.amabel.world/stanchito/sons-of-mountains:latest
    env_file: .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media:/app/public/media
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1g

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sonsofmountains
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Database-wide circuit breakers. They protect us even if a future code path
    # opens a transaction without using the Payload pool configuration.
    command: >
      postgres
      -c idle_in_transaction_session_timeout=30000
      -c lock_timeout=10000
      -c log_lock_waits=on
      -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      internal:
        aliases:
          - som-postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      internal:
        aliases:
          - som-redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media:

networks:
  internal:
    driver: bridge
