name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.amabel.world
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            git.amabel.world/${{ secrets.FORGEJO_USERNAME }}/sons-of-mountains:latest
            git.amabel.world/${{ secrets.FORGEJO_USERNAME }}/sons-of-mountains:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://sonsofmountain.com
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          provenance: false
          tags: |
            git.amabel.world/${{ secrets.FORGEJO_USERNAME }}/sons-of-mountains:migrator

  deploy:
    runs-on: native
    needs: build

    steps:
      - name: Pull and restart
        run: |
          set -euo pipefail
          echo "${{ secrets.FORGEJO_TOKEN }}" | docker login git.amabel.world \
            -u ${{ secrets.FORGEJO_USERNAME }} --password-stdin
          docker pull git.amabel.world/${{ secrets.FORGEJO_USERNAME }}/sons-of-mountains:latest
          docker pull git.amabel.world/${{ secrets.FORGEJO_USERNAME }}/sons-of-mountains:migrator
          cd /opt/sons-of-mountains
          docker compose -f docker-compose.prod.yml up -d postgres redis
          sleep 5
          docker compose -f docker-compose.prod.yml up \
            --force-recreate --no-deps --no-build \
            --exit-code-from migrate migrate || true
          docker compose -f docker-compose.prod.yml up -d \
            --force-recreate --no-deps --no-build app
          docker image prune -f
          echo "Deployed: ${{ github.sha }}"
